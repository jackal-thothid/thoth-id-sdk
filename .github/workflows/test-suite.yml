name: Reusable Test Suite

on:
  workflow_call:
    outputs:
      test_result:
        description: "The result of the test run"
        value: ${{ jobs.test.result }}

jobs:
  check-commit:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check_message.outputs.run_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check for [ignore-test]
        id: check_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[ignore-test]"* ]]; then
            echo "Found '[ignore-test]' in commit message, skipping tests."
            echo "run_tests=false" >> $GITHUB_OUTPUT
          else
            echo "Did not find '[ignore-test]' in commit message, running tests."
            echo "run_tests=true" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.run_tests == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The suite runs against the public Hathor testnet and discovers the
      # domain registries from the node, so it needs no local environment.
      # Public nodes rate-limit, so a run that trips over a 429 is retried.
      - name: Run tests against testnet
        run: |
          for i in 1 2 3; do
            echo "--- Attempt $i of 3 ---"
            if npm test; then
              echo "Tests passed on attempt $i."
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Tests failed on attempt $i. Retrying in 30 seconds..."
              sleep 30
            else
              echo "Tests failed after 3 attempts."
              exit 1
            fi
          done
