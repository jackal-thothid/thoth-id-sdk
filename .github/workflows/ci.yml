name: Continuous Integration

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  # Keep this job named `test`: branch protection on main requires the check
  # "test / Run Tests", the same name release.yml reports. Under any other name
  # the required check never reports on a pull request and it waits forever.
  test:
    uses: ./.github/workflows/test-suite.yml
