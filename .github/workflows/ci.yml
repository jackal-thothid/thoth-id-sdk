name: Continuous Integration

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  # Keep this job named `run-test-suite`: the ruleset on main requires the
  # check "run-test-suite / Run Tests". Under any other name the required check
  # never reports on a pull request and it waits forever.
  run-test-suite:
    uses: ./.github/workflows/test-suite.yml
