name: Release and Publish to npm

# Runs after a pull request is merged into main. `main` is protected, so this
# workflow never pushes commits to it: the version published to npm is the
# source of truth, the next one is computed from it, written to package.json
# only inside the runner, and recorded in git as a tag (tags are not covered by
# branch protection).

on:
  push:
    branches: [ main ]
    # CI-only changes never release, even with a release keyword. A merge that
    # also touches anything else still runs.
    paths-ignore:
      - '.github/**'

# Two merges in a row must not compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-suite.yml

  release:
    name: Tag and Publish
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the version tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      # The keyword comes from the merge commit, which carries the pull request
      # title, so put [major]/[minor]/[patch] in the PR title.
      - name: Determine version bump and release condition
        id: version_info
        run: |
          commit_message=$(git log -1 --pretty=%B)
          should_release="false"
          bump="patch"
          if [[ "$commit_message" == *"[major]"* || "$commit_message" == *"[breaking change]"* ]]; then
            bump="major"
            should_release="true"
          elif [[ "$commit_message" == *"[minor]"* || "$commit_message" == *"[feat]"* ]]; then
            bump="minor"
            should_release="true"
          elif [[ "$commit_message" == *"[patch]"* ]]; then
            bump="patch"
            should_release="true"
          fi

          if [[ "$should_release" == "true" ]]; then
            echo "Release keyword found. Bump type: $bump"
          else
            echo "No release keyword found. Skipping release steps."
          fi

          echo "bump=$bump" >> $GITHUB_OUTPUT
          echo "should_release=$should_release" >> $GITHUB_OUTPUT

      # Bumped from what npm actually serves, not from package.json or the
      # latest tag: if a previous run published but failed to push its tag,
      # the next run still moves forward instead of re-publishing a version.
      - name: Compute next version
        if: steps.version_info.outputs.should_release == 'true'
        id: next_version
        run: |
          name=$(node -p "require('./package.json').name")
          current=$(npm view "$name" version 2>/dev/null || echo "0.0.0")
          IFS=. read -r major minor patch <<< "${current%%-*}"
          case "${{ steps.version_info.outputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "Tag v$next already exists but $name@$next is not on npm. Fix the tag or publish it manually."
            exit 1
          fi
          echo "Published: $current -> releasing: $next"
          echo "version=$next" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.version_info.outputs.should_release == 'true'
        run: npm ci

      - name: Build project
        if: steps.version_info.outputs.should_release == 'true'
        run: npm run build

      # Only the runner's copy changes; nothing is committed.
      - name: Set package version
        if: steps.version_info.outputs.should_release == 'true'
        run: npm version "${{ steps.next_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        if: steps.version_info.outputs.should_release == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.version_info.outputs.should_release == 'true'
        run: |
          tag="v${{ steps.next_version.outputs.version }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
